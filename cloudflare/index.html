<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watch Cards">
<meta name="robots" content="noindex">
<title>Watch Cards</title>
<style>
  :root {
    --bg: #0b0b0f;
    --surface: #16161d;
    --surface-2: #1e1e27;
    --border: #2a2a35;
    --text: #f2f2f5;
    --muted: #8b8b99;
    --accent: #7c9cff;
    --accent-2: #b48cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  /* Lock screen */
  #lock { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding-bottom: 10vh; }
  .logo {
    width: 64px; height: 64px; border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; box-shadow: 0 10px 40px -10px var(--accent);
  }
  .logo svg { width: 32px; height: 32px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .hint { color: var(--muted); font-size: 14px; margin: -18px 0 0; min-height: 20px; text-align: center; }
  .hint.err { color: var(--danger); }
  .dots { display: flex; gap: 14px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); transition: background .15s, border-color .15s; }
  .dot.on { background: var(--text); border-color: var(--text); }
  .dots.shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
  .pad button {
    height: 76px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--text);
    font-family: inherit; font-size: 28px; font-weight: 400; line-height: 1; cursor: pointer; transition: background .1s, transform .1s;
  }
  .pad button:active { background: var(--border); transform: scale(.95); }
  .pad button.ghost { background: transparent; font-size: 15px; color: var(--muted); }
  .pad button:disabled { opacity: .4; }

  /* Feed */
  #feed { display: none; padding-bottom: 32px; }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0 12px; background: linear-gradient(var(--bg) 70%, transparent);
  }
  header h1 { font-size: 26px; }
  .status { color: var(--muted); font-size: 13px; }
  .icon-btn { background: var(--surface-2); border: 0; color: var(--text); width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .actions { display: flex; gap: 8px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 16px 18px; margin-bottom: 12px; animation: in .3s ease both;
  }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .card.latest {
    border-color: transparent; padding: 20px;
    background: linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-2)) border-box;
    border: 1.5px solid transparent;
  }
  .card .text { white-space: pre-wrap; word-wrap: break-word; }
  .card.latest .text { font-size: 19px; font-weight: 500; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .badge { color: var(--accent); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<div class="wrap">
  <section id="lock">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6V3h6v3M9 18v3h6v-3M12 10v2l1.5 1.5"/></svg></div>
    <h1>Watch Cards</h1>
    <p class="hint" id="hint">Enter passcode</p>
    <div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="pad" id="pad"></div>
  </section>

  <section id="feed">
    <header>
      <div><h1>Watch Cards</h1><div class="status" id="status"></div></div>
      <div class="actions">
        <button class="icon-btn" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg></button>
        <button class="icon-btn" id="lockBtn" aria-label="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      </div>
    </header>
    <div id="list"></div>
  </section>
</div>

<script>
(() => {
  const KEY = "watchcards.passcode";
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(KEY); } catch {} },
  };
  const $ = (id) => document.getElementById(id);
  let code = "", passcode = null, timer = null, busy = false;

  // Keypad
  const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  for (const k of keys) {
    const b = document.createElement("button");
    b.textContent = k;
    if (k === "") { b.className = "ghost"; b.disabled = true; b.style.visibility = "hidden"; }
    if (k === "⌫") { b.className = "ghost"; b.setAttribute("aria-label", "Delete"); }
    b.addEventListener("click", () => press(k));
    $("pad").appendChild(b);
  }
  document.addEventListener("keydown", (e) => {
    if ($("lock").style.display === "none") return;
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("⌫");
  });

  function drawDots() {
    [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i < code.length));
  }
  function hint(msg, err) { $("hint").textContent = msg; $("hint").classList.toggle("err", !!err); }

  async function press(k) {
    if (busy) return;
    if (k === "⌫") code = code.slice(0, -1);
    else if (code.length < 4) code += k;
    drawDots();
    if (code.length === 4) {
      busy = true;
      hint("Checking…");
      const r = await load(code);
      busy = false;
      if (r === "ok") { store.set(code); showFeed(); }
      else {
        $("dots").classList.add("shake");
        setTimeout(() => $("dots").classList.remove("shake"), 400);
        hint(r === "limit" ? "Too many attempts. Try again later." : r === "wrong" ? "Wrong passcode" : "Can't reach server", true);
        code = ""; drawDots();
      }
    }
  }

  // Data
  async function load(pc) {
    try {
      const res = await fetch("/cards", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ passcode: pc }),
        cache: "no-store",
      });
      if (res.status === 401) return "wrong";
      if (res.status === 429) return "limit";
      if (!res.ok) return "error";
      const { cards } = await res.json();
      passcode = pc;
      render(cards);
      return "ok";
    } catch { return "error"; }
  }

  function parseDate(s) {
    return new Date(String(s).replace(" ", "T").replace(/(\.\d{3})\d+/, "$1").replace(/([+-]\d{2})$/, "$1:00"));
  }
  function ago(d) {
    const s = Math.round((Date.now() - d) / 1000);
    if (s < 45) return "just now";
    const m = Math.round(s / 60); if (m < 60) return m + " min ago";
    const h = Math.round(m / 60); if (h < 24) return h + " h ago";
    const days = Math.round(h / 24); if (days < 7) return days + " d ago";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }
  function clock(d) { return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); }

  function render(cards) {
    const list = $("list");
    list.replaceChildren();
    if (!cards.length) {
      const e = document.createElement("div"); e.className = "empty"; e.textContent = "No cards yet.";
      list.appendChild(e);
    }
    cards.forEach((c, i) => {
      const d = parseDate(c.created_at);
      const el = document.createElement("article");
      el.className = "card" + (i === 0 ? " latest" : "");
      el.style.animationDelay = Math.min(i, 10) * 25 + "ms";
      const text = document.createElement("div"); text.className = "text"; text.textContent = c.text;
      const meta = document.createElement("div"); meta.className = "meta";
      const left = document.createElement("span");
      left.innerHTML = i === 0 ? '<span class="badge">Latest</span>' : "";
      if (i !== 0) left.textContent = "#" + c.id;
      const right = document.createElement("span"); right.textContent = ago(d) + " · " + clock(d);
      meta.append(left, right);
      el.append(text, meta);
      list.appendChild(el);
    });
    $("status").textContent = cards.length + (cards.length === 1 ? " card" : " cards") + " · updated " + clock(new Date());
  }

  async function refresh() {
    if (!passcode) return;
    $("refresh").classList.add("spin");
    const r = await load(passcode);
    $("refresh").classList.remove("spin");
    if (r === "wrong") lock("Passcode changed. Enter the new one.");
    else if (r !== "ok") $("status").textContent = "Offline · retrying";
  }

  function showFeed() {
    $("lock").style.display = "none";
    $("feed").style.display = "block";
    clearInterval(timer);
    timer = setInterval(refresh, 30000);
  }
  function lock(msg) {
    clearInterval(timer);
    passcode = null; code = ""; store.clear(); drawDots();
    $("feed").style.display = "none";
    $("lock").style.display = "flex";
    hint(msg || "Enter passcode", !!msg);
  }

  $("refresh").addEventListener("click", refresh);
  $("lockBtn").addEventListener("click", () => lock());
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  // Auto-unlock with a remembered passcode (still verified by the server).
  const saved = store.get();
  if (saved) load(saved).then((r) => (r === "ok" ? showFeed() : r === "wrong" ? lock() : (passcode = saved, showFeed(), refresh())));
})();
</script>
</body>
</html>
