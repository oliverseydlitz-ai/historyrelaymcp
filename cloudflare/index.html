<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watch Cards">
<meta name="robots" content="noindex">
<title>Watch Cards</title>
<style>
  :root {
    --bg: #0b0b0f;
    --surface: #16161d;
    --surface-2: #1e1e27;
    --border: #2a2a35;
    --text: #f2f2f5;
    --muted: #8b8b99;
    --accent: #7c9cff;
    --accent-2: #b48cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  /* Lock screen */
  #lock { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding-bottom: 10vh; }
  .logo {
    width: 64px; height: 64px; border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; box-shadow: 0 10px 40px -10px var(--accent);
  }
  .logo svg { width: 32px; height: 32px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .hint { color: var(--muted); font-size: 14px; margin: -18px 0 0; min-height: 20px; text-align: center; }
  .hint.err { color: var(--danger); }
  .dots { display: flex; gap: 14px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); transition: background .15s, border-color .15s; }
  .dot.on { background: var(--text); border-color: var(--text); }
  .dots.shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
  .pad button {
    height: 76px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--text);
    font-family: inherit; font-size: 28px; font-weight: 400; line-height: 1; cursor: pointer; transition: background .1s, transform .1s;
  }
  .pad button:active { background: var(--border); transform: scale(.95); }
  .pad button.ghost { background: transparent; font-size: 15px; color: var(--muted); }
  .pad button:disabled { opacity: .4; }

  /* Feed */
  #feed { display: none; padding-bottom: 32px; }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0 12px; background: linear-gradient(var(--bg) 70%, transparent);
  }
  header h1 { font-size: 26px; }
  .status { color: var(--muted); font-size: 13px; }
  .icon-btn { background: var(--surface-2); border: 0; color: var(--text); width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .actions { display: flex; gap: 8px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 16px 18px; margin-bottom: 12px; animation: in .3s ease both;
  }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .card.latest {
    border-color: transparent; padding: 20px;
    background: linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-2)) border-box;
    border: 1.5px solid transparent;
  }
  .card .text { white-space: pre-wrap; word-wrap: break-word; }
  .card.latest .text { font-size: 19px; font-weight: 500; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .badge { color: var(--accent); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }


  /* Admin */
  #admin { display: none; padding-bottom: 40px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .panel h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 12px; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit; padding: 12px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row + .row { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .row .label { font-weight: 500; }
  .row .sub { color: var(--muted); font-size: 13px; }
  .btn {
    border: 0; border-radius: 12px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
  }
  .btn.secondary { background: var(--surface-2); color: var(--text); font-weight: 500; }
  .btn.danger { background: transparent; color: var(--danger); padding: 6px 8px; font-weight: 500; font-size: 14px; }
  .btn:disabled { opacity: .5; }
  .compose-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--muted); font-size: 13px; }
  .switch { position: relative; width: 51px; height: 31px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; border-radius: 31px; background: var(--border); transition: background .2s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch input:checked + span { background: #34c759; }
  .switch input:checked + span::after { transform: translateX(20px); }
  .acard { padding: 12px 0; }
  .acard + .acard { border-top: 1px solid var(--border); }
  .acard .text { white-space: pre-wrap; word-wrap: break-word; }
  .acard .meta { margin-top: 6px; align-items: center; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(120px);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 14px;
    font-size: 14px; transition: transform .25s; z-index: 10; max-width: calc(100% - 32px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.err { color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <section id="lock">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6V3h6v3M9 18v3h6v-3M12 10v2l1.5 1.5"/></svg></div>
    <h1>Watch Cards</h1>
    <p class="hint" id="hint">Enter passcode</p>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
  </section>

  <section id="feed">
    <header>
      <div><h1>Watch Cards</h1><div class="status" id="status"></div></div>
      <div class="actions">
        <button class="icon-btn" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg></button>
        <button class="icon-btn" id="lockBtn" aria-label="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      </div>
    </header>
    <div id="list"></div>
  </section>

  <section id="admin">
    <header>
      <div><h1>Admin</h1><div class="status" id="adminStatus"></div></div>
      <div class="actions">
        <button class="icon-btn" id="adminRefresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg></button>
        <button class="icon-btn" id="adminExit" aria-label="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      </div>
    </header>

    <div class="panel">
      <h2>New card</h2>
      <textarea id="compose" maxlength="1000" placeholder="Write a card…"></textarea>
      <div class="compose-foot"><span id="count">0 / 1000</span><button class="btn" id="send">Post card</button></div>
    </div>

    <div class="panel">
      <h2>Settings</h2>
      <div class="row"><div><div class="label">Feed page</div><div class="sub">Friends can open the feed with the passcode</div></div>
        <label class="switch"><input type="checkbox" data-key="feed_enabled"><span></span></label></div>
      <div class="row"><div><div class="label">Telegram pings</div><div class="sub">Message everyone on each new card</div></div>
        <label class="switch"><input type="checkbox" data-key="telegram_enabled"><span></span></label></div>
      <div class="row"><div><div class="label">Card text in Telegram</div><div class="sub">Include the card's text, not just its number</div></div>
        <label class="switch"><input type="checkbox" data-key="telegram_include_text"><span></span></label></div>
    </div>

    <div class="panel">
      <h2>Security</h2>
      <div class="row"><div><div class="label">Wrong codes</div><div class="sub" id="feedFails"></div></div>
        <button class="btn secondary" id="resetLockout">Reset counter</button></div>
    </div>

    <div class="panel">
      <h2 id="cardsTitle">Cards</h2>
      <div id="adminList"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = "watchcards.passcode";
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(KEY); } catch {} },
  };
  const $ = (id) => document.getElementById(id);
  let code = "", passcode = null, timer = null, busy = false;
  let adminCode = null;         // admin code lives in memory only, never in storage
  const CODE_LEN = 4;

  // The server decides what a code unlocks: the feed code opens the feed, the admin code opens the admin panel.
  function resetKeypad() {
    code = "";
    $("dots").replaceChildren(...Array.from({ length: CODE_LEN }, () => Object.assign(document.createElement("span"), { className: "dot" })));
    hint("Enter passcode");
  }

  // Keypad
  const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  for (const k of keys) {
    const b = document.createElement("button");
    b.textContent = k;
    if (k === "") { b.className = "ghost"; b.disabled = true; b.style.visibility = "hidden"; }
    if (k === "⌫") { b.className = "ghost"; b.setAttribute("aria-label", "Delete"); }
    b.addEventListener("click", () => press(k));
    $("pad").appendChild(b);
  }
  resetKeypad();
  document.addEventListener("keydown", (e) => {
    if ($("lock").style.display === "none") return;
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("⌫");
  });

  function drawDots() {
    [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i < code.length));
  }
  function hint(msg, err) { $("hint").textContent = msg; $("hint").classList.toggle("err", !!err); }

  async function press(k) {
    if (busy) return;
    if (k === "⌫") code = code.slice(0, -1);
    else if (code.length < CODE_LEN) code += k;
    drawDots();
    if (code.length === CODE_LEN) {
      busy = true;
      hint("Checking…");
      const r = await unlock(code);
      busy = false;
      if (r === "feed") { store.set(code); showFeed(); }
      else if (r === "admin") showAdmin();
      else {
        $("dots").classList.add("shake");
        setTimeout(() => $("dots").classList.remove("shake"), 400);
        hint(r === "limit" ? "Too many attempts. Try again later." : r === "wrong" ? "Wrong code"
          : r === "paused" ? "The feed is paused right now." : "Can't reach server", true);
        code = ""; drawDots();
      }
    }
  }

  // Data
  async function unlock(pc) {
    try {
      const res = await fetch("/unlock", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ passcode: pc }),
        cache: "no-store",
      });
      if (res.status === 401) return "wrong";
      if (res.status === 429) return "limit";
      if (res.status === 403) return "paused";
      if (!res.ok) return "error";
      const data = await res.json();
      if (data.role === "admin") { adminCode = pc; adminState = data; renderAdmin(); return "admin"; }
      passcode = pc;
      render(data.cards);
      return "feed";
    } catch { return "error"; }
  }

  async function load(pc) {
    try {
      const res = await fetch("/cards", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ passcode: pc }),
        cache: "no-store",
      });
      if (res.status === 401) return "wrong";
      if (res.status === 429) return "limit";
      if (res.status === 403) return "paused";
      if (!res.ok) return "error";
      const { cards } = await res.json();
      passcode = pc;
      render(cards);
      return "ok";
    } catch { return "error"; }
  }

  function parseDate(s) {
    return new Date(String(s).replace(" ", "T").replace(/(\.\d{3})\d+/, "$1").replace(/([+-]\d{2})$/, "$1:00"));
  }
  function ago(d) {
    const s = Math.round((Date.now() - d) / 1000);
    if (s < 45) return "just now";
    const m = Math.round(s / 60); if (m < 60) return m + " min ago";
    const h = Math.round(m / 60); if (h < 24) return h + " h ago";
    const days = Math.round(h / 24); if (days < 7) return days + " d ago";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }
  function clock(d) { return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); }

  function render(cards) {
    const list = $("list");
    list.replaceChildren();
    if (!cards.length) {
      const e = document.createElement("div"); e.className = "empty"; e.textContent = "No cards yet.";
      list.appendChild(e);
    }
    cards.forEach((c, i) => {
      const d = parseDate(c.created_at);
      const el = document.createElement("article");
      el.className = "card" + (i === 0 ? " latest" : "");
      el.style.animationDelay = Math.min(i, 10) * 25 + "ms";
      const text = document.createElement("div"); text.className = "text"; text.textContent = c.text;
      const meta = document.createElement("div"); meta.className = "meta";
      const left = document.createElement("span");
      left.innerHTML = i === 0 ? '<span class="badge">Latest</span>' : "";
      if (i !== 0) left.textContent = "#" + c.id;
      const right = document.createElement("span"); right.textContent = ago(d) + " · " + clock(d);
      meta.append(left, right);
      el.append(text, meta);
      list.appendChild(el);
    });
    $("status").textContent = cards.length + (cards.length === 1 ? " card" : " cards") + " · updated " + clock(new Date());
  }

  async function refresh() {
    if (!passcode) return;
    $("refresh").classList.add("spin");
    const r = await load(passcode);
    $("refresh").classList.remove("spin");
    if (r === "wrong") lock("Passcode changed. Enter the new one.");
    else if (r === "paused") lock("The feed is paused right now.");
    else if (r !== "ok") $("status").textContent = "Offline · retrying";
  }

  function showFeed() {
    $("lock").style.display = "none";
    $("feed").style.display = "block";
    clearInterval(timer);
    timer = setInterval(refresh, 30000);
  }
  function lock(msg) {
    clearInterval(timer);
    passcode = null; adminCode = null; store.clear();
    resetKeypad();
    $("feed").style.display = "none";
    $("admin").style.display = "none";
    $("lock").style.display = "flex";
    if (msg) hint(msg, true);
  }

  // ---- Admin ----
  var adminState = null;
  function toast(msg, err) {
    const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // Every admin request re-sends the code; the server checks it each time.
  async function adminCall(action, extra, codeOverride) {
    const pc = codeOverride ?? adminCode;
    try {
      const res = await fetch("/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ passcode: pc, action, ...extra }),
        cache: "no-store",
      });
      if (res.status === 401) return "wrong";
      if (res.status === 429) return "limit";
      if (!res.ok) return "error";
      adminCode = pc;
      adminState = await res.json();
      renderAdmin();
      return "ok";
    } catch { return "error"; }
  }

  async function adminDo(action, extra, okMsg) {
    const r = await adminCall(action, extra);
    if (r === "ok") { if (okMsg) toast(okMsg); return true; }
    if (r === "wrong") { lock("Admin code changed."); return false; }
    toast(r === "limit" ? "Locked: too many wrong codes" : "Something went wrong", true);
    return false;
  }

  function renderAdmin() {
    const { settings, cards, stats } = adminState;
    document.querySelectorAll("#admin [data-key]").forEach((el) => { el.checked = !!settings[el.dataset.key]; });
    $("feedFails").textContent = stats.failures_last_hour + " / " + stats.max_failures_per_hour + " in the last hour"
      + (stats.failures_last_hour >= stats.max_failures_per_hour ? " · locked" : "");
    $("cardsTitle").textContent = "Cards (" + cards.length + ")";
    $("adminStatus").textContent = "updated " + clock(new Date());
    const list = $("adminList");
    list.replaceChildren();
    if (!cards.length) list.append(Object.assign(document.createElement("div"), { className: "sub", textContent: "No cards yet." }));
    for (const c of cards) {
      const d = parseDate(c.created_at);
      const el = document.createElement("div"); el.className = "acard";
      const text = document.createElement("div"); text.className = "text"; text.textContent = c.text;
      const meta = document.createElement("div"); meta.className = "meta";
      const info = document.createElement("span"); info.textContent = "#" + c.id + " · " + ago(d) + " · " + clock(d);
      const del = document.createElement("button"); del.className = "btn danger"; del.textContent = "Delete";
      del.addEventListener("click", async () => {
        if (!confirm("Delete card #" + c.id + "?")) return;
        del.disabled = true;
        if (!(await adminDo("delete", { id: c.id }, "Card #" + c.id + " deleted"))) del.disabled = false;
      });
      meta.append(info, del);
      el.append(text, meta);
      list.append(el);
    }
  }

  function showAdmin() {
    clearInterval(timer);
    $("lock").style.display = "none";
    $("feed").style.display = "none";
    $("admin").style.display = "block";
    window.scrollTo(0, 0);
  }

  $("adminExit").addEventListener("click", () => lock());
  $("adminRefresh").addEventListener("click", () => adminDo("state", {}));
  $("compose").addEventListener("input", () => { $("count").textContent = $("compose").value.length + " / 1000"; });
  $("send").addEventListener("click", async () => {
    const text = $("compose").value.trim();
    if (!text) return toast("Write something first", true);
    $("send").disabled = true;
    if (await adminDo("post", { text }, "Card posted")) { $("compose").value = ""; $("count").textContent = "0 / 1000"; }
    $("send").disabled = false;
  });
  document.querySelectorAll("#admin [data-key]").forEach((el) => el.addEventListener("change", async () => {
    el.disabled = true;
    const ok = await adminDo("set", { key: el.dataset.key, value: el.checked }, "Saved");
    if (!ok) el.checked = !el.checked;
    el.disabled = false;
  }));
  $("resetLockout").addEventListener("click", () => adminDo("reset_lockout", {}, "Counter reset"));

  $("refresh").addEventListener("click", refresh);
  $("lockBtn").addEventListener("click", () => lock());
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  // Auto-unlock with a remembered passcode (still verified by the server).
  const saved = store.get();
  if (saved) load(saved).then((r) => (r === "ok" ? showFeed() : r === "wrong" ? lock() : (passcode = saved, showFeed(), refresh())));
})();
</script>
</body>
</html>
